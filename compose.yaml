services:
  mysql-db:
    image: 'mysql:8.4'
    container_name: 'mysql-db'
    ports:
      - '3306:3306'
    environment:
      - 'MYSQL_DATABASE=ecommerce'
      - 'MYSQL_PASSWORD=123123'
      - 'MYSQL_ROOT_PASSWORD=123123'
      - 'MYSQL_USER=user'
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql-data: